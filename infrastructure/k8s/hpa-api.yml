---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novafsm-api-hpa
  namespace: production
  labels:
    app: novafsm
    component: api
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novafsm-api

  minReplicas: 3
  maxReplicas: 10

  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        - type: Percent
          value: 50  # Scale down by 50% of current pods
          periodSeconds: 60
        - type: Pods
          value: 2  # Or scale down by 2 pods
          periodSeconds: 60
      selectPolicy: Min  # Use the policy that results in fewer pods removed

    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100  # Scale up by 100% of current pods
          periodSeconds: 30
        - type: Pods
          value: 4  # Or scale up by 4 pods
          periodSeconds: 30
      selectPolicy: Max  # Use the policy that results in more pods added

---
# ============================================================================
# NOTES:
# ============================================================================
# 1. Metrics Server must be installed in the cluster for HPA to work:
#    kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# 2. For more advanced scaling (e.g., based on custom metrics like request rate):
#    - Install Prometheus Adapter
#    - Configure custom metrics
#    - Add metrics like:
#      - type: Pods
#        pods:
#          metric:
#            name: http_requests_per_second
#          target:
#            type: AverageValue
#            averageValue: "1000"
#
# 3. Monitor HPA status:
#    kubectl get hpa -n production
#    kubectl describe hpa novafsm-api-hpa -n production
# ============================================================================
