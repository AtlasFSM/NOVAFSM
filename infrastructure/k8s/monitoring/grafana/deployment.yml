---
# PersistentVolumeClaim for Grafana data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: gp3  # Uncomment and set your storage class

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        fsGroup: 472  # Grafana group
        runAsUser: 472  # Grafana user
        runAsNonRoot: true

      # Init container to set permissions
      initContainers:
        - name: init-chmod-data
          image: busybox:latest
          command: ['sh', '-c', 'chmod -R 777 /var/lib/grafana']
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          env:
            # Admin credentials (USE SECRETS IN PRODUCTION!)
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"  # CHANGE THIS IN PRODUCTION

            # Paths
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_LOGS
              value: /var/log/grafana
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning

            # Server settings
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_SERVER_PROTOCOL
              value: "http"

            # Analytics
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Resources
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            # Grafana configuration
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini

            # Persistent storage
            - name: grafana-storage
              mountPath: /var/lib/grafana

            # Datasources provisioning
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources

            # Dashboards provisioning configuration
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards

            # Dashboard JSON files (will be added via ConfigMaps)
            - name: novafsm-api-dashboard
              mountPath: /var/lib/grafana/dashboards/novafsm-api-dashboard.json
              subPath: novafsm-api-dashboard.json

            - name: novafsm-infrastructure-dashboard
              mountPath: /var/lib/grafana/dashboards/novafsm-infrastructure-dashboard.json
              subPath: novafsm-infrastructure-dashboard.json

      volumes:
        # Grafana main config
        - name: grafana-config
          configMap:
            name: grafana-config
            items:
              - key: grafana.ini
                path: grafana.ini

        # Persistent storage
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage

        # Datasources configuration
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

        # Dashboards provisioning
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config

        # Dashboard JSON files
        - name: novafsm-api-dashboard
          configMap:
            name: grafana-dashboard-novafsm-api

        - name: novafsm-infrastructure-dashboard
          configMap:
            name: grafana-dashboard-novafsm-infrastructure
