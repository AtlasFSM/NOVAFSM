---
# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    # Prometheus Configuration for NoVaFSM
    global:
      scrape_interval: 15s  # How often to scrape targets
      evaluation_interval: 15s  # How often to evaluate rules
      external_labels:
        cluster: 'novafsm-production'
        environment: 'production'

    # Alertmanager configuration (optional - add if using Alertmanager)
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets:
    #             - alertmanager:9093

    # Load alerting rules
    rule_files:
      - '/etc/prometheus/alerts/*.yml'

    # Scrape configurations
    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              component: 'prometheus'

      # Scrape Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Scrape Kubernetes nodes (cAdvisor)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Scrape Kubernetes pods with prometheus.io annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape=true annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # Use custom scrape path if defined
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # Use custom port if defined
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

          # Add pod metadata as labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: kubernetes_node

      # Scrape NoVaFSM API (production namespace)
      - job_name: 'novafsm-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: novafsm-api
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Scrape NoVaFSM Web Dashboard (production namespace)
      - job_name: 'novafsm-web'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: novafsm-web
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Scrape Kubernetes services with metrics
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_service_name

  # Alerting Rules
  alerts.yml: |
    groups:
      - name: novafsm-api-alerts
        interval: 30s
        rules:
          # High error rate (> 1% of requests)
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{status=~"5..", job="novafsm-api"}[5m]))
                /
                sum(rate(http_requests_total{job="novafsm-api"}[5m]))
              ) > 0.01
            for: 5m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "High error rate detected in NoVaFSM API"
              description: "API error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

          # High latency (p95 > 2s)
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{job="novafsm-api"}[5m])) by (le)
              ) > 2
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API latency detected"
              description: "API p95 latency is {{ $value }}s (threshold: 2s)"

          # API pod down
          - alert: APIPodDown
            expr: |
              up{job="novafsm-api"} == 0
            for: 2m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "NoVaFSM API pod is down"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is down"

          # Too few API replicas running
          - alert: InsufficientAPIReplicas
            expr: |
              count(up{job="novafsm-api"} == 1) < 2
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "Insufficient API replicas running"
              description: "Only {{ $value }} API pod(s) running (expected: 3)"

      - name: novafsm-infrastructure-alerts
        interval: 30s
        rules:
          # High CPU usage (> 80%)
          - alert: HighCPUUsage
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{namespace="production"}[5m])) by (pod)
                /
                sum(container_spec_cpu_quota{namespace="production"} / container_spec_cpu_period{namespace="production"}) by (pod)
              ) > 0.8
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High CPU usage detected"
              description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }}"

          # High memory usage (> 80%)
          - alert: HighMemoryUsage
            expr: |
              (
                sum(container_memory_working_set_bytes{namespace="production"}) by (pod)
                /
                sum(container_spec_memory_limit_bytes{namespace="production"}) by (pod)
              ) > 0.8
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High memory usage detected"
              description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

          # Pod restart loop
          - alert: PodRestartLoop
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="production"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              component: infrastructure
            annotations:
              summary: "Pod is in restart loop"
              description: "Pod {{ $labels.pod }} is restarting frequently"

      - name: novafsm-database-alerts
        interval: 30s
        rules:
          # Database connection errors
          - alert: DatabaseConnectionErrors
            expr: |
              rate(database_errors_total{type="connection"}[5m]) > 0.1
            for: 3m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "Database connection errors detected"
              description: "Database connection error rate: {{ $value }} errors/sec"

          # Slow database queries (> 1s)
          - alert: SlowDatabaseQueries
            expr: |
              histogram_quantile(0.95,
                sum(rate(database_query_duration_seconds_bucket[5m])) by (le)
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Slow database queries detected"
              description: "Database query p95 latency: {{ $value }}s"
