---
# PersistentVolumeClaim for Prometheus data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # Adjust based on retention needs
  # storageClassName: gp3  # Uncomment and set your storage class

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1  # Prometheus doesn't support HA out-of-the-box; use Thanos for HA
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534  # nobody group
        runAsNonRoot: true
        runAsUser: 65534  # nobody user

      # Init container to set correct permissions on volume
      initContainers:
        - name: init-chmod-data
          image: busybox:latest
          command: ['sh', '-c', 'chmod -R 777 /prometheus']
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'  # Keep data for 30 days
            - '--storage.tsdb.retention.size=45GB'  # Max storage size
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-lifecycle'  # Enable reload via HTTP POST
            - '--web.enable-admin-api'  # Enable admin API for management

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Resource requests and limits
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
            - name: prometheus-alerts
              mountPath: /etc/prometheus/alerts

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml

        - name: prometheus-alerts
          configMap:
            name: prometheus-config
            items:
              - key: alerts.yml
                path: alerts.yml

        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-storage

      # Node affinity (optional - pin to specific nodes if needed)
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         preference:
      #           matchExpressions:
      #             - key: node-role.kubernetes.io/monitoring
      #               operator: Exists

      # Tolerations (optional - if monitoring nodes are tainted)
      # tolerations:
      #   - key: monitoring
      #     operator: Equal
      #     value: "true"
      #     effect: NoSchedule
