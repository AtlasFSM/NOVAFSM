---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novafsm-config
  namespace: production
  labels:
    app: novafsm
    environment: production
data:
  # Environment
  NODE_ENV: "production"

  # Backend API
  BACKEND_PORT: "3000"
  BACKEND_HOST: "0.0.0.0"

  # Database Pool
  DATABASE_POOL_MIN: "5"
  DATABASE_POOL_MAX: "20"

  # Redis
  REDIS_DB: "0"

  # JWT Configuration
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
  JWT_ISSUER: "novafsm"
  JWT_AUDIENCE: "novafsm-api"

  # AWS Region
  AWS_REGION: "us-east-1"

  # S3 Configuration
  S3_FORCE_PATH_STYLE: "false"
  AWS_SECRETS_MANAGER_ENABLED: "false"

  # CORS Configuration
  CORS_ORIGINS: "https://app.novafsm.com,https://api.novafsm.com"

  # Observability (OpenTelemetry)
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "novafsm-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_TRACES_SAMPLER_RATIO: "0.1"

  # Rate Limiting
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"

  # Security
  BCRYPT_ROUNDS: "12"

  # Web Dashboard
  NEXT_PUBLIC_API_URL: "https://api.novafsm.com"
  NEXT_PUBLIC_WS_URL: "wss://api.novafsm.com"
