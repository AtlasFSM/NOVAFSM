---
# ============================================================================
# SECRET TEMPLATE - DO NOT COMMIT THIS FILE WITH ACTUAL VALUES
# ============================================================================
# INSTRUCTIONS:
# 1. Copy this file: cp secrets.example.yml secrets.yml
# 2. Replace all placeholder values with actual base64 encoded secrets
# 3. Ensure secrets.yml is in .gitignore (it should never be committed)
# 4. Apply: kubectl apply -f secrets.yml
#
# To encode a value: echo -n "your-value" | base64
# To decode a value: echo "base64-value" | base64 -d
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: novafsm-secrets
  namespace: production
  labels:
    app: novafsm
    environment: production
type: Opaque
data:
  # Database Connection
  # Example: echo -n "postgresql://user:pass@host:5432/db" | base64
  DATABASE_URL: "<BASE64_ENCODED_DATABASE_URL>"

  # Redis Configuration
  # Example: echo -n "redis.prod.cluster.local" | base64
  REDIS_HOST: "<BASE64_ENCODED_REDIS_HOST>"
  # Example: echo -n "6379" | base64
  REDIS_PORT: "<BASE64_ENCODED_REDIS_PORT>"
  # Example: echo -n "your-redis-password" | base64
  REDIS_PASSWORD: "<BASE64_ENCODED_REDIS_PASSWORD>"

  # JWT Keys (RS256)
  # Generate with: openssl genrsa -out private.pem 2048
  # Encode: cat private.pem | base64 -w 0
  JWT_PRIVATE_KEY: "<BASE64_ENCODED_JWT_PRIVATE_KEY>"
  # Generate with: openssl rsa -in private.pem -pubout -out public.pem
  # Encode: cat public.pem | base64 -w 0
  JWT_PUBLIC_KEY: "<BASE64_ENCODED_JWT_PUBLIC_KEY>"

  # AWS Credentials (if not using IRSA)
  # Note: Prefer IRSA (IAM Roles for Service Accounts) over hardcoded credentials
  # Example: echo -n "AKIAIOSFODNN7EXAMPLE" | base64
  AWS_ACCESS_KEY_ID: "<BASE64_ENCODED_AWS_ACCESS_KEY_ID>"
  # Example: echo -n "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" | base64
  AWS_SECRET_ACCESS_KEY: "<BASE64_ENCODED_AWS_SECRET_ACCESS_KEY>"

  # S3 Bucket
  # Example: echo -n "novafsm-prod-uploads" | base64
  S3_BUCKET: "<BASE64_ENCODED_S3_BUCKET_NAME>"

  # Session Secret (generate random 64 char string)
  # Example: openssl rand -hex 32 | tr -d '\n' | base64
  SESSION_SECRET: "<BASE64_ENCODED_SESSION_SECRET>"

  # AWS Secrets Manager (optional)
  # AWS_SECRETS_MANAGER_SECRET_NAME: "<BASE64_ENCODED_SECRET_NAME>"

---
