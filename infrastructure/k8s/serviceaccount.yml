---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novafsm-api
  namespace: production
  labels:
    app: novafsm
    component: api
    environment: production
  annotations:
    # IRSA (IAM Roles for Service Accounts)
    # Replace with your actual IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/NoVaFSM-EKS-ServiceAccount-Role
    # Optional: External Secrets Operator
    # eks.amazonaws.com/sts-regional-endpoints: "true"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novafsm-web
  namespace: production
  labels:
    app: novafsm
    component: web
    environment: production
  annotations:
    # Web dashboard typically doesn't need AWS access
    # But you can add IAM role if needed for client-side AWS SDK usage

---
